command:
  - "uv"
  - "run"
  - "start-app"

env:
  - name: MLFLOW_TRACKING_URI
    value: "databricks"
  - name: MLFLOW_REGISTRY_URI
    value: "databricks-uc"
  - name: MLFLOW_EXPERIMENT_ID
    valueFrom: "experiment"
  - name: API_PROXY
    value: "http://localhost:8000/invocations"
  - name: CHAT_APP_PORT
    value: "3000"
  - name: CHAT_PROXY_TIMEOUT_SECONDS
    value: "300"
  - name: DATABRICKS_CATALOG
    value: "pavan_naidu"
  - name: DATABRICKS_SCHEMA
    value: "nba"
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: "nba-warehouse"
  - name: NBA_CUSTOM_AGENT_LLM_ENDPOINT
    valueFrom: "custom-agent-llm"
  - name: NBA_SUPERVISOR_CONNECT_TIMEOUT_SECONDS
    value: "15"
  - name: NBA_SUPERVISOR_READ_TIMEOUT_SECONDS
    value: "300"
